name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: windows-x64-obs-deps-${{ hashFiles('buildspec.json') }}

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage plugin
        shell: pwsh
        run: |
          $stage = "stage/stream-notify"
          $tls = Get-ChildItem ".deps/obs-deps-qt6-*-x64/plugins/tls/qschannelbackend.dll" | Select-Object -First 1
          if (-not $tls) { throw "Qt Schannel backend not found" }
          New-Item -ItemType Directory -Force "$stage/bin/64bit", "$stage/data/tls" | Out-Null
          Copy-Item build/Release/stream-notify.dll "$stage/bin/64bit/"
          Copy-Item -Recurse data/locale "$stage/data/"
          Copy-Item $tls.FullName "$stage/data/tls/"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: stream-notify-windows-x64
          path: stage/
          if-no-files-found: error
